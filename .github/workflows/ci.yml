name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # 无显示环境下跑 Qt（测试只用 QtCore/QtGui，不需要真实窗口）
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 Qt 运行库（PyQt6 offscreen 运行所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3 libxkbcommon0

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pytest

      - name: 运行测试
        run: python3 -m pytest tests/ -v
